name: PR Build

on:
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: windows-2022

    env:
      Solution_Name: CollarSystem.Plugin

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Build with dotnet
      run: dotnet build CollarSystem.Plugin/CollarSystem.Plugin.csproj --configuration Release

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CollarSystem.Plugin
        path: .\CollarSystem.Plugin\bin\x64\Release\CollarSystem.Plugin\*
        if-no-files-found: error
        retention-days: 1
